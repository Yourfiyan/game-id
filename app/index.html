<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game ID</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="pages/home.css">
  <link rel="stylesheet" href="pages/library.css">
  <link rel="stylesheet" href="pages/game-detail.css">
  <link rel="stylesheet" href="pages/analytics.css">
  <link rel="stylesheet" href="pages/accounts.css">
  <link rel="stylesheet" href="pages/stores.css">
  <link rel="stylesheet" href="pages/collections.css">
  <link rel="stylesheet" href="pages/settings.css">
  <link rel="stylesheet" href="pages/search.css">
</head>
<body>
  <div id="app" class="app">
    <!-- ===== Sidebar ===== -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" ry="3"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
        </div>
        <span class="name">Game ID</span>
      </div>

      <div class="account-switcher">
        <button class="account-btn" data-account="A">A</button>
        <button class="account-btn active" data-account="B">B</button>
      </div>

      <nav class="nav">
        <a href="#home" class="nav-link active" data-route="home">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9.75L12 3l9 6.75V20a2 2 0 01-2 2H5a2 2 0 01-2-2V9.75z"/></svg></span>
          Home
        </a>
        <a href="#library" class="nav-link" data-route="library">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>
          Library
        </a>
        <a href="#collections" class="nav-link" data-route="collections">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.82-.33l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></span>
          Collections
        </a>
        <a href="#stores" class="nav-link" data-route="stores">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg></span>
          Stores
        </a>
        <a href="#accounts" class="nav-link" data-route="accounts">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          Accounts
        </a>
        <a href="#analytics" class="nav-link" data-route="analytics">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span>
          Analytics
        </a>
        <a href="#search" class="nav-link" data-route="search">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
          Search
        </a>

        <div class="nav-divider"></div>

        <a href="#settings" class="nav-link" data-route="settings">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.82-.33l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></span>
          Settings
        </a>
      </nav>
    </aside>

    <!-- ===== Main ===== -->
    <main class="main">
      <header class="topbar">
        <div class="breadcrumb" id="breadcrumb">Home</div>
        <div class="topbar-right">
          <div class="topbar-search">
            <input type="text" id="topbar-search" placeholder="Search your library">
          </div>
          <div class="sync-status">
            <span class="sync-dot"></span>
            <span>Synced 4m ago</span>
          </div>
          <button class="sync-btn">Sync now</button>
          <div class="user-avatar">SK</div>
        </div>
      </header>
      <div class="content" id="content">
        <div class="loading"><div class="spinner"></div>Loading...</div>
      </div>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
