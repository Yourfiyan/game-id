<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Library Dashboard</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="pages/home.css">
  <link rel="stylesheet" href="pages/library.css">
  <link rel="stylesheet" href="pages/game-detail.css">
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1 class="brand">Game Library</h1>
        <div class="account-switcher">
          <button class="account-btn active" data-account="B">Account B</button>
          <button class="account-btn" data-account="A">Account A</button>
        </div>
      </div>
      <nav class="nav">
        <a href="#home" class="nav-link active">
          <span class="nav-icon">🏠</span>
          <span class="nav-label">Home</span>
        </a>
        <a href="#library" class="nav-link">
          <span class="nav-icon">🎮</span>
          <span class="nav-label">Library</span>
        </a>
        <a href="#analytics" class="nav-link">
          <span class="nav-icon">📊</span>
          <span class="nav-label">Analytics</span>
        </a>
      </nav>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="breadcrumb" id="breadcrumb">Home</div>
        <div class="topbar-actions">
          <button class="icon-btn" id="search-btn" title="Search library">🔍</button>
          <button class="icon-btn" id="filter-btn" title="Filters">⚙️</button>
        </div>
      </div>

      <div class="content" id="content">
        <!-- Pages load here dynamically -->
        <div class="loading">Loading...</div>
      </div>
    </main>
  </div>

  <script type="module" src="services/loader.js"></script>
  <script type="module" src="services/filters.js"></script>
  <script type="module" src="services/analytics.js"></script>
  <script type="module" src="pages/home.js"></script>
  <script type="module" src="pages/library.js"></script>
  <script type="module" src="pages/game-detail.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
